name: Deploy project page from Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release containing project-page.zip
        required: true
        default: v0.1.2
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download website release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p download site
          gh release download "$RELEASE_TAG" --pattern project-page.zip --dir download
          unzip -q download/project-page.zip -d site
          test -f site/index.html
          test -f site/assets/3R-Adapter-NeurIPS2026-2min.mp4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
