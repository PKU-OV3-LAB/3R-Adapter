model: ARCroco3DStereo(ARCroco3DStereoConfig(state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, freeze='encoder_and_decoder_and_head',
  use_adapter=True, reduction_dim=128, peft_parts=['enc','dec'], peft_layers=[[20,21,22,23],[8,9,10,11]], adapter_type='Adapter3R'))
pretrained: cut3r_512_dpt_4_64.pth
load_only_encoder: False
long_context: False
fixed_length: True
resume: null
benchmark: True
num_views : 4
num_test_views : 4
n_corres_train: 0
n_corres_test: 0


train_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)
test_criterion: Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)

resolution:
- (512
- 384)
- (512
- 336)
- (512
- 288)
- (512
- 256)
- (512
- 208)
- (512
- 144)
- (384
- 512)
- (336
- 512)
- (288
- 512)
- (256
- 512)
dataset1: OxfordDayAndNight(allow_repeat=True, split='train', ROOT='external/assets',
  aug_crop=16, resolution=[(512, 384), (512, 336), (512, 288), (512, 256), (512, 208),
  (512, 144), (384, 512), (336, 512), (288, 512), (256, 512)], transform=SeqColorJitter,
  num_views=${num_views}, n_corres=${n_corres_train})

train_dataset: 4000 @ ${dataset1} 
test_dataset: 1000 @ OxfordDayAndNight(split='test', ROOT='external/assets', resolution=224, num_views=4, seed=42, n_corres=0)

seed: 0
batch_size: 8
accum_iter: 1
gradient_checkpointing: true
epochs: 20
start_epoch: 0
weight_decay: 0.05
lr: 2.0e-03
min_lr: 1.0e-06
warmup_epochs: 2
amp: 1

num_workers: 8
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 5
print_freq: 10
print_img_freq: 20000
num_imgs_vis: 4
save_dir: 'checkpoints'
exp_name: '3RAdapter128.enc20t23.dec8t11-4v-4inter-lr1en3'
task: 'cut3r'
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ./${save_dir}/${exp_name}
